include: _default_template_yaml
task: cultural_robustness_specific_all
custom_dataset: !function utils.load_dataset_specific
tag:
  - cultural_robustness
  - cultural_robustness_specific
metric_list:
  - metric: cultural_robustness
    aggregation: cultural_robustness_agg
    higher_is_better: true
  # CSP needs both tasks in the same run (--tasks cultural_robustness); NaN otherwise.
  - metric: cultural_signal_purity
    aggregation: cultural_signal_purity_agg
    higher_is_better: true
  - metric: cultural_signal_purity_question_level
    aggregation: cultural_signal_purity_question_level_agg
    higher_is_better: true
metadata:
  version: 1.0
