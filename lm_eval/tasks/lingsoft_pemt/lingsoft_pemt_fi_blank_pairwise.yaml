task: lingsoft_pemt_fi_blank_pairwise
dataset_path: LumiOpen/lingsoft-pemt-evals
dataset_name: FI_blank_7choice
dataset_kwargs:
  revision: 1ce3b857820ee34c9e42573980a0c4308677ffce
test_split: test
fewshot_split: fewshot
process_docs: !function utils_pairwise.process_docs
fewshot_config:
  sampler: first_n
  process_docs: !function utils_pairwise.process_fewshot_docs
num_fewshot: 5
tag:
  - lingsoft_pemt
  - lingsoft_pemt_fi
  - lingsoft_pemt_blank
  - lingsoft_pemt_blank_pairwise
output_type: multiple_choice
doc_to_text: "{{ prompt }}"
doc_to_choice: "{{ choices }}"
doc_to_target: "{{ target }}"
target_delimiter: ""
process_results: !function utils_pairwise.process_results
metric_list:
  - metric: gold_acc
    aggregation: !function utils_pairwise.agg_gold_acc
    higher_is_better: true
  - metric: gold_pair_acc
    aggregation: !function utils_pairwise.agg_gold_pair_acc
    higher_is_better: true
  - metric: gold_pair_acc_debiased
    aggregation: !function utils_pairwise.agg_gold_pair_acc_debiased
    higher_is_better: true
  - metric: item_beats_all
    aggregation: !function utils_pairwise.agg_item_beats_all
    higher_is_better: true
  - metric: item_copeland_acc
    aggregation: !function utils_pairwise.agg_item_copeland_acc
    higher_is_better: true
  - metric: first_choice_rate
    aggregation: !function utils_pairwise.agg_first_choice_rate
    higher_is_better: false
metadata:
  version: 1.0
  test_sha256: 582cc5d87ba11394f8a56357987df4c64a6fc3895c85c3fae1a02487e570f1aa
